[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daneel"
version = "0.1.0"
authors = [{ name = "Tiziano Zingales", email = "tiziano.zingales@unipd.it" }]
description = "Teaching tools for exoplanet transit modelling and detection"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PyYAML>=6.0",
    "batman-package>=2.4",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]


classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=3.0",
]

[project.scripts]
daneel = "daneel.__main__:main"

[project.urls]
Homepage = "https://github.com/tiziano1590/comp_astro_26"
Issues = "https://github.com/tiziano1590/comp_astro_26/issues"
